#//// Neoffice — added file (no upstream equivalent).
#//// Fails the build when a change of ours disappears from the fork. Runs on
#//// PUSH, not only on pull_request: we push straight to version-15, so a
#//// PR-only workflow (see linters.yml) would never fire on the merge commit
#//// that eats something — which is exactly the moment it has to fire.
name: Neoffice Divergence

on:
  push:
    branches: [version-15]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  divergence:
    name: 'Neoffice changes still present'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Check the divergence inventory
        run: python3 scripts/neoffice-divergence.py
