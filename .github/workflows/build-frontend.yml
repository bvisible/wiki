name: build-frontend

on:
  push:
    branches: [version-15]
    paths:
      - 'frontend/**'
      - '!**/node_modules/**'
      - '!wiki/public/frontend/**'
      - '!wiki/www/wiki-app.html'

permissions:
  contents: write

concurrency:
  group: build-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          # 24, as upstream's own CI builds this frontend (frappe-ui beta.76 era, v3.3.0).
          node-version: 24
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      # frontend/package.json links @framework/ui to ../../frappe/ui, i.e. the ui/
      # package of a frappe checkout that sits NEXT TO this repository. It exists on
      # frappe develop and version-16 only (not on version-15, which our fleet runs),
      # and it is not on npm. Pinned to the commit the committed build was made with
      # (frappe develop, 2026-09-28): move the pin deliberately, with a rebuild.
      - name: Fetch @framework/ui (frappe/ui)
        env:
          FRAPPE_UI_SHA: 87aa8410de3365eb7c31c25525a815c5bf397739
        run: |
          git init "$GITHUB_WORKSPACE/../frappe"
          cd "$GITHUB_WORKSPACE/../frappe"
          git remote add origin https://github.com/frappe/frappe.git
          git sparse-checkout set ui
          git fetch --depth 1 --filter=blob:none origin "$FRAPPE_UI_SHA"
          git checkout FETCH_HEAD
          ls ui/package.json

      - name: Create common_site_config stub
        run: |
          mkdir -p ../../sites
          echo '{"socketio_port": 9000}' > ../../sites/common_site_config.json

      - name: Install
        run: cd frontend && yarn install --frozen-lockfile

      - name: Build
        run: cd frontend && yarn build

      - name: Commit artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # //// Neoffice — wiki-app.html, not wiki.html: wiki v3 renamed the
          # //// SPA entry point (frontend/vite.config.js -> buildConfig
          # //// .indexHtmlPath). git add fails hard on a pathspec that matches
          # //// nothing, so this step exited 128 on every run from 2026-08-09
          # //// onward and the bot stopped committing artifacts entirely, while
          # //// the build step above kept passing.
          git add wiki/public/frontend wiki/www/wiki-app.html
          if git diff --cached --quiet; then
            echo "No artifact changes to commit"
            exit 0
          fi
          git commit --no-verify -m "[skip-build] frontend artifacts for ${GITHUB_SHA::8}"
          git push
